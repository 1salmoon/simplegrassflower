name: Build SimpleFlowersGrass

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        id: proj
        run: |
          file="$(find . -name xmake.lua -not -path './.xmake/*' | head -n1)"
          if [ -z "$file" ]; then
            echo "xmake.lua not found. Files in repo:"
            find . -maxdepth 3 -not -path './.git/*' | sort
            exit 1
          fi
          echo "dir=$(dirname "$file")" >> "$GITHUB_OUTPUT"
          echo "Project dir: $(dirname "$file")"

      - name: Setup Android NDK r28c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure
        working-directory: ${{ steps.proj.outputs.dir }}
        run: xmake f -y -p android -a arm64-v8a -m release --ndk="${{ steps.ndk.outputs.ndk-path }}"

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: xmake -y

      - name: Collect outputs
        run: |
          mkdir -p dist
          find . -path ./dist -prune -o -name "SimpleFlowersGrass.levipack" -print -exec cp {} dist/ \;
          find . -path ./dist -prune -o -name "libSimpleFlowersGrass.so" -print -exec cp {} dist/ \;
          ls -la dist
          test -f dist/SimpleFlowersGrass.levipack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleFlowersGrass
          path: dist/*

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
