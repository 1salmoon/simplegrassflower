name: Build SimpleGrassFlower

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Works whether the source is committed as extracted files or only as a .zip.
      - name: Locate project (xmake.lua)
        id: proj
        shell: bash
        run: |
          find_xmake() {
            find . -name xmake.lua \
              -not -path "./.git/*" -not -path "*/build/*" \
              -not -path "*/.xmake/*" -not -path "./dist/*" \
              | awk '{ print gsub("/","/") " " $0 }' | sort -n | head -n1 | cut -d' ' -f2-
          }

          FILE=$(find_xmake)

          if [ -z "$FILE" ]; then
            echo "xmake.lua not found as a file, looking inside .zip files..."
            while IFS= read -r -d '' ZIP; do
              if unzip -Z1 "$ZIP" 2>/dev/null | grep -qE '(^|/)xmake\.lua$'; then
                echo "Found xmake.lua inside: $ZIP"
                rm -rf ./_from_zip
                mkdir -p ./_from_zip
                unzip -q -o "$ZIP" -d ./_from_zip
                break
              fi
            done < <(find . -name "*.zip" -not -path "./.git/*" -not -path "./_from_zip/*" -print0)
            FILE=$(find_xmake)
          fi

          if [ -z "$FILE" ]; then
            echo "::error::xmake.lua not found in the repository or inside any .zip"
            find . -not -path "./.git/*" | head -50
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Android NDK r28c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure
        working-directory: ${{ steps.proj.outputs.dir }}
        run: xmake f -y -p android -a arm64-v8a -m release --ndk="${{ steps.ndk.outputs.ndk-path }}"

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: xmake -y

      - name: Collect outputs
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find build -name "SimpleGrassFlower.levipack" -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          find build -name "libSimpleGrassFlower.so" -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          ls -la "$GITHUB_WORKSPACE/dist"
          test -f "$GITHUB_WORKSPACE/dist/SimpleGrassFlower.levipack"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleGrassFlower
          path: dist/*
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
