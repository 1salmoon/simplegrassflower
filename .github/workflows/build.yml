 concurrency: name: Build SimpleGrassFlower

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK r28c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Locate xmake.lua
        id: proj
        shell: bash
        run: |
          find_xmake() {
            # Shallowest xmake.lua in the repo (root or any subfolder).
            find . -name xmake.lua \
              -not -path "./.git/*" -not -path "*/build/*" \
              -not -path "*/.xmake/*" -not -path "./dist/*" \
              | awk '{ print gsub("/","/") " " $0 }' | sort -n | head -n1 | cut -d' ' -f2-
          }

          FILE=$(find_xmake)

          # Fallback: the source was committed as a .zip instead of extracted files.
          if [ -z "$FILE" ]; then
            mapfile -t ZIPS < <(find . -maxdepth 3 -name "*.zip" -not -path "./.git/*")
            for Z in "${ZIPS[@]}"; do
              if unzip -Z1 "$Z" 2>/dev/null | grep -qE '(^|/)xmake\.lua$'; then
                echo "::warning::xmake.lua not found in repo, but it is inside $Z -> extracting it for this build. Commit the extracted files to fix this permanently."
                unzip -q -o "$Z" -d ./_from_zip
                break
              fi
            done
            FILE=$(find_xmake)
          fi

          if [ -z "$FILE" ]; then
            echo "::error::xmake.lua not found anywhere in the repository (also not inside any .zip)"
            find . -not -path "./.git/*" | head -50
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "Found $FILE -> project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Configure
        working-directory: ${{ steps.proj.outputs.dir }}
        run: xmake f -y -p android -a arm64-v8a -m release --ndk="${{ steps.ndk.outputs.ndk-path }}"

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: xmake -y

      - name: Collect outputs
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find build -name "SimpleGrassFlower.levipack" -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          find build -name "libSimpleGrassFlower.so" -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          ls -la "$GITHUB_WORKSPACE/dist"
          test -f "$GITHUB_WORKSPACE/dist/SimpleGrassFlower.levipack"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleGrassFlower
          path: dist/*
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
