name: Build SimpleFlowersGrass

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source zip
        id: proj
        run: |
          mkdir -p _src
          z=$(find . -maxdepth 2 -iname "*.zip" -not -path "./.git/*" -not -path "./_src/*" | head -n1)
          if [ -n "$z" ]; then
            echo "Unzipping $z"
            unzip -q -o "$z" -d _src
          else
            echo "No zip found, using repo files directly"
            rsync -a --exclude=.git --exclude=_src ./ _src/
          fi
          f=$(find _src -name xmake.lua | head -n1)
          if [ -z "$f" ]; then
            echo "xmake.lua not found. Files:"
            find . -not -path "./.git/*" -maxdepth 3 | head -60
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Project dir: $(dirname "$f")"

      - name: Setup Android NDK r28c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure
        working-directory: ${{ steps.proj.outputs.dir }}
        run: xmake f -y -p android -a arm64-v8a -m release --ndk="${{ steps.ndk.outputs.ndk-path }}"

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: xmake -y

      - name: Collect outputs
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          mkdir -p dist
          find build -name "SimpleFlowersGrass.levipack" -exec cp {} dist/ \;
          find build -name "libSimpleFlowersGrass.so" -exec cp {} dist/ \;
          ls -la dist
          test -f dist/SimpleFlowersGrass.levipack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleFlowersGrass
          path: ${{ steps.proj.outputs.dir }}/dist/*
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.proj.outputs.dir }}/dist/*
